[workspace]
resolver = "2"
members = ["core", "modules/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[package]
name = "aku"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cron = ["dep:aku_cron"]
postgres = ["dep:aku_postgres", "aku_serenity/postgres", "aku_fluxer/postgres"]
serenity = ["dep:aku_serenity"]
fluxer = ["dep:aku_fluxer"]
runtime = []

[dependencies]
aku_core = { workspace = true }
aku_cron = { workspace = true, optional = true }
aku_postgres = { workspace = true, optional = true }
aku_serenity = { workspace = true, optional = true }
aku_fluxer = { workspace = true, optional = true }

[workspace.dependencies]
aku_core.path = "core"
aku_cron.path = "modules/cron"
aku_postgres.path = "modules/postgres"
aku_serenity.path = "modules/serenity"
aku_fluxer.path = "modules/fluxer"

paste = "^1.0"
extend = "^1.2"
sqlx = { version = "^0.9", features = ["runtime-tokio", "postgres"] }
sea-query = "^1.0"
sea-query-sqlx = { version = "^0.9.1", features = ["sqlx-postgres"] }
tokio-cron-scheduler = "^0.15"
serenity = "^0.12"
log = "^0.4"
fluxer-neptunium = "^0.9"
